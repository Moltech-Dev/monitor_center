<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="MC.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Monitor Center</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Orbitron',sans-serif;display:flex;height:100vh}

    .left-panel{
      width:60%;
      position:relative;
      overflow:hidden;
    }
    .left-panel video{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .right-panel{
      width:40%;
      background:linear-gradient(160deg,#0d1117 0%,#111827 50%,#0d1117 100%);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;position:relative;overflow:hidden;
    }
    .right-panel::before{
      content:'';position:absolute;width:360px;height:360px;border-radius:50%;
      background:radial-gradient(circle,rgba(59,130,246,.1) 0%,transparent 70%);
      top:-100px;right:-100px;pointer-events:none;
    }
    .right-panel::after{
      content:'';position:absolute;width:240px;height:240px;border-radius:50%;
      background:radial-gradient(circle,rgba(99,102,241,.08) 0%,transparent 70%);
      bottom:30px;left:-70px;pointer-events:none;
    }

    .fuel-title{
      position:absolute;top:32px;left:50%;transform:translateX(-50%);
      font-size:38px;font-family:'Bodoni Moda',serif;font-weight:700;
      letter-spacing:4px;text-transform:uppercase;text-align:center;white-space:nowrap;
      background:linear-gradient(135deg,#fff 0%,#93c5fd 55%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      z-index:10;
    }

    .login-box{
      width:80%;max-width:400px;margin-top:80px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      border-radius:24px;padding:2rem 2.2rem;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    }
    .login-box h2{
      color:#f1f5f9;margin-bottom:28px;font-size:22px;
      text-align:center;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.5px;
    }

    .input-group{
      display:flex;align-items:center;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;margin:10px 0;padding:12px 14px;
      position:relative;transition:border-color .25s,box-shadow .25s;
    }
    .input-group:focus-within{
      border-color:rgba(96,165,250,.55);
      box-shadow:0 0 0 3px rgba(59,130,246,.13);
    }
    .input-group i{color:rgba(148,163,184,.75);font-size:16px}
    .input-group input{
      border:none;background:none;outline:none;flex:1;font-size:15px;
      margin-left:10px;color:#f1f5f9;font-family:'Inter',sans-serif;
    }
    .input-group input::placeholder{color:rgba(148,163,184,.55)}
    #togglePassword{position:absolute;right:14px;cursor:pointer;color:rgba(148,163,184,.65);font-size:15px;transition:color .2s}
    #togglePassword:hover{color:#93c5fd}

    .login-box button{
      width:100%;padding:13px;margin-top:20px;
      background:linear-gradient(135deg,#3b82f6 0%,#6366f1 100%);
      color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:15px;
      font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.4px;
      transition:transform .2s,box-shadow .2s,filter .2s;
    }
    .login-box button:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(59,130,246,.4);
      filter:brightness(1.05);
    }
    .login-box button:active{transform:translateY(0);box-shadow:none}

    .login-box .forgot{margin-top:16px;font-size:13px;text-align:center}
    .login-box .forgot a{
      display:inline-block;padding:6px 16px;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
      color:rgba(255,255,255,.7);border-radius:8px;text-decoration:none;cursor:pointer;
      font-family:'Inter',sans-serif;font-size:12px;transition:all .22s;
    }
    .login-box .forgot a:hover{
      background:rgba(59,130,246,.18);border-color:rgba(96,165,250,.4);color:#93c5fd;
    }

    .error-message{
      color:#f87171;font-size:13px;display:none;text-align:center;margin-top:12px;
      font-family:'Inter',sans-serif;background:rgba(239,68,68,.1);
      border-radius:8px;padding:8px 12px;
    }

    .footer{
      position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
      text-align:center;font-size:12px;font-family:'Inter',sans-serif;
    }
    .footer a,.footer a:visited{color:rgba(148,163,184,.5);text-decoration:none;transition:color .2s}
    .footer a:hover{color:rgba(148,163,184,.85)}
    .footer-line{display:flex;align-items:center;justify-content:center;gap:8px}
    .footer-icon{height:24px;vertical-align:middle}
  </style>
</head>
<body>

  <!-- PANEL IZQUIERDO CON VIDEO -->
  <div class="left-panel">
    <video src="video.mp4" autoplay muted loop playsinline></video>
  </div>

  <!-- PANEL DERECHO (LOGIN) -->
  <div class="right-panel">
    <div class="fuel-title">Monitor Center S.L.P.</div>

    <div class="login-box">
      <h2>Bienvenido</h2>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Usuario">
      </div>

      <div class="input-group">
        <i class="fas fa-key"></i>
        <input type="password" id="password" placeholder="Contraseña">
        <i class="fas fa-eye" id="togglePassword"></i>
      </div>

      <button onclick="login()">Iniciar sesión</button>

      <p class="forgot">
        <a onclick="forgotPassword()">He olvidado mi contraseña</a>
      </p>
      <p class="error-message" id="error">Usuario o contraseña incorrectos</p>
    </div>

    <footer class="footer">
      <p class="footer-line">
        <a href="https://www.monitorcenterslp.com/" 
           target="_blank" 
           rel="noopener" 
           title="Visitar monitorcenterslp.com">
           <strong>Monitor Center S.L.P. © 2026</strong>
        </a>
      </p>
    </footer>
  </div>

  <script>
  /***************  CONFIGURACIÓN  ***************/
  const WEBAPP_URL = ''; 
  const SHEET_ID = '1QOuA10BbJaYctYyY4959TwaPGXRG-pzeHPFZmnqKpxI';
  const API_KEY  = 'AIzaSyBZGnqBc7zMxADfA19HADzYLtv2F0AjMcs';
  const RANGE    = encodeURIComponent('USUARIOS!A2:C'); 
  let currentUsername = '';

  async function fetchUsuarios() {
    if (WEBAPP_URL) {
      const res = await fetch(WEBAPP_URL);
      const j = await res.json();
      return j.values || [];
    }
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    return data.values || [];
  }

  async function login () {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('error');
    errorMsg.style.display = 'none';

    if (!username || !password) {
      errorMsg.textContent = 'Debes ingresar usuario y contraseña';
      errorMsg.style.display = 'block';
      return;
    }

    try {
      const filas = await fetchUsuarios();
      const fila = filas.find(r =>
        ((r[0] || '').trim().toLowerCase() === username.toLowerCase()) &&
        ((r[1] || '').trim() === password)
      );

      if (!fila) {
        errorMsg.textContent = 'Usuario o contraseña incorrectos';
        errorMsg.style.display = 'block';
        return;
      }

      const user  = (fila[0] || '').trim();
      const role  = (fila[2] || '').trim();

      sessionStorage.setItem('USER', user);
      sessionStorage.setItem('ROLE', role);

      window.location.href = 'home.html';

    } catch (err) {
      console.error('Login error:', err);
      errorMsg.textContent = 'Error al conectar con la base de datos';
      errorMsg.style.display = 'block';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const userInput = document.getElementById('username');

    if (toggle && passwordInput) {
      toggle.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggle.classList.toggle('fa-eye-slash');
      });
    }
    if (userInput) {
      userInput.addEventListener('input', (e) => {
        currentUsername = e.target.value.trim();
      });
    }
  });

  function forgotPassword () {
    const user = currentUsername || document.getElementById('username')?.value || 'Sin usuario';
    const msg  = `🔒 He olvidado mi contraseña.\nUsuario: ${user}`;
    const phone = '524441118550';
    const url   = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }
  </script>
</body>
</html>
